<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- DEEP BRAND IDENTITY - WHITE PORCELAIN PEEKER ICON -->
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-grad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>

    <!-- Porcelain Dome 3D Shading -->
    <radialGradient id="dome-grad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f5f7fa"/>
      <stop offset="60%" stop-color="#d5dde6"/>
      <stop offset="88%" stop-color="#9aa6b8"/>
      <stop offset="100%" stop-color="#637083"/>
    </radialGradient>

    <!-- Deep Ambient Occlusion Drop Shadow Behind Dome -->
    <radialGradient id="dome-ao" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Edge Rim Glare (Apple Glass Effect) -->
    <linearGradient id="glass-rim" x1="0" y1="0" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Eye Socket Recessed Ambient Inset -->
    <filter id="eye-recess" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Squircle Clip Path -->
    <clipPath id="squircle-clip">
      <rect width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <!-- Squircle Base Frame -->
  <g clip-path="url(#squircle-clip)">
    <!-- Obsidian Dark Canvas -->
    <rect width="512" height="512" fill="url(#bg-grad)"/>

    <!-- Ambient Shadow Under Dome -->
    <ellipse cx="220" cy="460" rx="280" ry="160" fill="url(#dome-ao)"/>

    <!-- PEEKING WHITE CERAMIC DOME (Rising gracefully from lower-left to upper-right) -->
    <path d="M -80 580 
             C -80 240, 160 70, 360 70 
             C 455 70, 520 125, 570 195 
             C 615 260, 620 440, 620 580 
             Z" 
          fill="url(#dome-grad)"/>

    <!-- Crest Specular Highlight Curve on Dome -->
    <path d="M 0 420 
             C 30 220, 185 85, 355 85 
             C 420 85, 475 115, 520 170" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.9" 
          fill="none"/>

    <!-- Secondary Soft Crest Glare -->
    <path d="M 40 380 
             C 70 240, 195 120, 340 120" 
          stroke="#ffffff" 
          stroke-width="16" 
          stroke-linecap="round" 
          opacity="0.2" 
          fill="none"/>

    <!-- TWO TILTED CAPSULE EYES (/ /) - INQUISITIVE AND ALERT -->
    <!-- Left Eye (Main) -->
    <g transform="translate(245, 260) rotate(-42)">
      <rect x="-25" y="-58" width="50" height="116" rx="25" fill="#0c0e12" filter="url(#eye-recess)"/>
      <!-- Subtle Specular Reflection Dot inside Eye -->
      <circle cx="-8" cy="-30" r="5" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- Right Eye (Slightly foreshortened on 3D curve) -->
    <g transform="translate(365, 205) rotate(-42)">
      <rect x="-22" y="-50" width="44" height="100" rx="22" fill="#0c0e12" filter="url(#eye-recess)"/>
      <!-- Subtle Specular Reflection Dot inside Eye -->
      <circle cx="-7" cy="-26" r="4.5" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- GLASS SQUIRCLE RIM SPECULAR GLARE (Apple Glass Bevel from Image 2) -->
    <rect width="512" height="512" rx="114" fill="url(#glass-rim)" pointer-events="none"/>
    <path d="M 114 4 L 400 4 C 470 4, 508 42, 508 112" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none"/>
  </g>

  <!-- 1.5px Crisp Glass Outer Border -->
  <rect width="512" height="512" rx="114" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>
</svg>