<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- DEEP PEEKER - WHITE CERAMIC HERO (IMAGE 3) -->
  <defs>
    <linearGradient id="pw-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <radialGradient id="pw-dome" cx="36%" cy="30%" r="66%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f4f6f8"/>
      <stop offset="60%" stop-color="#d2dae4"/>
      <stop offset="88%" stop-color="#96a3b5"/>
      <stop offset="100%" stop-color="#5f6d80"/>
    </radialGradient>

    <radialGradient id="pw-shadow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pw-rim" x1="0" y1="0" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="pw-inset" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <clipPath id="pw-clip">
      <rect width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pw-clip)">
    <rect width="512" height="512" fill="url(#pw-bg)"/>
    <ellipse cx="230" cy="460" rx="280" ry="160" fill="url(#pw-shadow)"/>

    <!-- PEEKING 3D CERAMIC DOME -->
    <path d="M -80 580 C -80 230, 160 65, 360 65 C 455 65, 520 120, 570 190 C 615 255, 620 440, 620 580 Z" fill="url(#pw-dome)"/>

    <!-- Crest Highlight Curve -->
    <path d="M 0 420 C 30 215, 185 80, 355 80 C 420 80, 475 110, 520 165" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9" fill="none"/>
    <path d="M 40 380 C 70 235, 195 115, 340 115" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.2" fill="none"/>

    <!-- ANGLED CAPSULE EYES (/ /) -->
    <g transform="translate(245, 255) rotate(-42)">
      <rect x="-25" y="-58" width="50" height="116" rx="25" fill="#0b0d11" filter="url(#pw-inset)"/>
      <circle cx="-8" cy="-30" r="5" fill="#ffffff" opacity="0.25"/>
    </g>

    <g transform="translate(365, 200) rotate(-42)">
      <rect x="-22" y="-50" width="44" height="100" rx="22" fill="#0b0d11" filter="url(#pw-inset)"/>
      <circle cx="-7" cy="-26" r="4.5" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- macOS / VisionOS Glass Rim Edge -->
    <rect width="512" height="512" rx="114" fill="url(#pw-rim)" pointer-events="none"/>
    <path d="M 114 4 L 400 4 C 470 4, 508 42, 508 112" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.65" fill="none"/>
  </g>
  <rect width="512" height="512" rx="114" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
</svg>