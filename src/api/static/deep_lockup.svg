<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <!-- DEEP HORIZONTAL LOCKUP (DARK MODE) -->
  <defs>
    <!-- Scale Holographic Gradient -->
    <linearGradient id="lck-holo" x1="260" y1="120" x2="680" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="lck-dome" cx="36%" cy="30%" r="66%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f4f6f8"/>
      <stop offset="60%" stop-color="#d2dae4"/>
      <stop offset="90%" stop-color="#96a3b5"/>
      <stop offset="100%" stop-color="#5f6d80"/>
    </radialGradient>

    <clipPath id="lck-icon-clip">
      <rect x="40" y="40" width="160" height="160" rx="36"/>
    </clipPath>
  </defs>

  <!-- 1. The Icon on Left (160x160 Squircle) -->
  <g clip-path="url(#lck-icon-clip)">
    <rect x="40" y="40" width="160" height="160" fill="#13151b"/>
    <path d="M 10 240 C 10 130, 90 70, 160 70 C 190 70, 220 90, 235 115 C 250 140, 250 200, 250 240 Z" fill="url(#lck-dome)"/>
    <!-- Eyes -->
    <g transform="translate(120, 135) rotate(-42)">
      <rect x="-8" y="-19" width="16" height="38" rx="8" fill="#0b0d11"/>
    </g>
    <g transform="translate(160, 118) rotate(-42)">
      <rect x="-7" y="-16" width="14" height="32" rx="7" fill="#0b0d11"/>
    </g>
  </g>
  <rect x="40" y="40" width="160" height="160" rx="36" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

  <!-- 2. Typography on Right -->
  <!-- Wordmark 'deep' in Scale AI Hologram -->
  <g fill="url(#lck-holo)" transform="translate(230, -10) scale(0.72)">
    <!-- 'd' -->
    <path d="M 80 50 C 80 43 85 38 92 38 C 99 38 104 43 104 50 L 104 88 C 114 74 130 65 152 65 C 190 65 218 95 218 136 C 218 177 190 207 152 207 C 130 207 114 198 104 184 L 104 195 C 104 202 99 207 92 207 C 85 207 80 202 80 195 Z M 148 89 C 122 89 104 110 104 136 C 104 162 122 183 148 183 C 174 183 192 162 192 136 C 192 110 174 89 148 89 Z" fill-rule="evenodd"/>
    <!-- 'e' 1 -->
    <path d="M 240 136 C 240 96 268 65 308 65 C 348 65 374 95 374 136 C 374 142 370 146 364 146 L 266 146 C 269 169 286 184 309 184 C 324 184 337 177 344 167 C 348 162 354 161 359 164 C 364 167 366 174 362 179 C 350 196 331 207 308 207 C 268 207 240 176 240 136 Z M 348 123 C 345 103 331 88 308 88 C 285 88 270 103 266 123 Z" fill-rule="evenodd"/>
    <!-- 'e' 2 -->
    <path d="M 396 136 C 396 96 424 65 464 65 C 504 65 530 95 530 136 C 530 142 526 146 520 146 L 422 146 C 425 169 442 184 465 184 C 480 184 493 177 500 167 C 504 162 510 161 515 164 C 520 167 522 174 518 179 C 506 196 487 207 464 207 C 424 207 396 176 396 136 Z M 504 123 C 501 103 487 88 464 88 C 441 88 426 103 422 123 Z" fill-rule="evenodd"/>
    <!-- 'p' -->
    <path d="M 552 75 C 552 68 557 65 564 65 C 571 65 576 68 576 75 L 576 88 C 586 74 602 65 624 65 C 662 65 690 95 690 136 C 690 177 662 207 624 207 C 602 207 586 198 576 184 L 576 235 C 576 242 571 247 564 247 C 557 247 552 242 552 235 Z M 620 89 C 594 89 576 110 576 136 C 576 162 594 183 620 183 C 646 183 664 162 664 136 C 664 110 646 89 620 89 Z" fill-rule="evenodd" transform="translate(-20, 0)"/>
  </g>

  <!-- Subtitle Tagline -->
  <text x="290" y="180" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.25em">
    AUTONOMOUS AGENTIC OS
  </text>
</svg>